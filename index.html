const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
 return new TextDecoder().decode(out);
}
async function go(pw,remember){
 const html=await open(pw);
 try{if(remember)sessionStorage.setItem('qbr_pw',pw)}catch(e){}
 document.open();document.write(html);document.close();
}
(async()=>{let s=null;try{s=sessionStorage.getItem('qbr_pw')}catch(e){} if(s){try{await go(s,false)}catch(e){try{sessionStorage.removeItem('qbr_pw')}catch(_){}}}})();
document.getElementById('f').addEventListener('submit',async e=>{
 e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');
 b.disabled=true;b.textContent='Opening…';er.textContent='';
 try{await go(document.getElementById('pw').value,true)}catch(x){er.textContent='That password didn\'t work. Please try again.';b.disabled=false;b.textContent='Open the QBR'}
});
</script></body></html>
